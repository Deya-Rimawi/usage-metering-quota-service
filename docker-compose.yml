services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metering}
      POSTGRES_DB: metering
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"   # for local dev/tests only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metering"]
      interval: 2s
      timeout: 3s
      retries: 30

  service:
    build: ./service
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-metering}@db:5432/metering
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ready || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "3000:3000"

  client:
    build: ./client
    environment:
      SERVICE_URL: http://service:3000
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
    depends_on:
      service:
        condition: service_healthy
    ports:
      - "8080:8080"

  # End-to-end check of the demo scenario against the running stack:  docker compose run --rm e2e
  e2e:
    build: ./client
    profiles: ["tools"]
    command: ["node", "--test"]
    environment:
      SERVICE_URL: http://service:3000
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
    depends_on:
      service:
        condition: service_healthy

volumes:
  pgdata:
