services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metering}
      POSTGRES_DB: metering
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"   # for local dev/tests only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metering"]
      interval: 2s
      timeout: 3s
      retries: 30

  service:
    build: ./service
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-metering}@db:5432/metering
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      PG_POOL_MAX: ${PG_POOL_MAX:-20}
      ACCOUNT_CONCURRENCY: ${ACCOUNT_CONCURRENCY:-1}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ready || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${SERVICE_PORT:-3000}:3000"   # BIND_ADDR=127.0.0.1 in .env publishes on localhost only

  client:
    build: ./client
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      SERVICE_URL: http://service:3000
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
    depends_on:
      service:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${CLIENT_PORT:-8080}:8080"   # the demo client acts with an API key: prefer BIND_ADDR=127.0.0.1

  # End-to-end check of the demo scenario against the running stack:  docker compose run --rm e2e
  e2e:
    build: ./client
    profiles: ["tools"]
    command: ["node", "--test"]
    environment:
      SERVICE_URL: http://service:3000
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
    depends_on:
      service:
        condition: service_healthy

  # Load tests:  docker compose --profile tools run --rm loadtest all --label mytest
  loadtest:
    build: ./loadtest
    profiles: ["tools"]
    environment:
      SERVICE_URL: http://service:3000
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-metering}@db:5432/metering
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
    volumes:
      - ./loadtest/results:/app/results
    depends_on:
      service:
        condition: service_healthy

volumes:
  pgdata:
